[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fif-agents"
version = "0.1.0"
description = "Fifty GCP multi-agent operations workflows built with Google ADK"
requires-python = ">=3.11"
dependencies = ["google-adk==2.12.0", "google-auth>=2.40,<3", "requests>=2.32,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
fif-agents = "fif_agents.cli:main"

[tool.setuptools.packages.find]
include = ["fif_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
